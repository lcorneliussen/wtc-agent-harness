# Repo registry for the wtc-dogfood workspace — the worktree-collection
# workspace in which wtc-agent-harness hosts itself.
#
# Tracked and authoritative. The generated local counterpart mapping each name
# to its bare owner on this machine is `.harness-repos`, written by
# `wtc registry refresh` (gitignored).
#
# Parsed by the CLI, so the shape is load-bearing:
#   * a repo block starts with a `- name: <repo>` line
#   * every other field is `<key>: <value>` — one scalar, no inline comments
#
# Fields:
#   remote         clone URL for the bare owner (always the forge, never a
#                  local path — see instructions/worktree-workspace.md)
#   default_ref    the development tip; detached worktrees rest here
#   port_offset    added to the collection's port base to give the repo a
#                  per-collection port (<REPO>_PORT in .env.collection).
#                  Keep unique and stable — it is a contract between repos.
#   issues_prefix  only for repos with an in-repo issue tracker. This
#                  workspace tracks issues on GitHub, so no repo sets one.
#   role           one line, for humans reading this file

schema_version: 1

repositories:
  # This harness. Its worktree is always the collection's `harness/` dir.
  - name: wtc-agent-harness
    remote: git@github.com:lcorneliussen/wtc-agent-harness.git
    default_ref: origin/main
    role: Dogfood harness — instructions, registry, collection tools.

  # The official Worktree Collections site. Serves HTTP once it has a stack,
  # so it takes the first port offset: WTC_SITE_PORT = base + 1.
  - name: wtc-site
    remote: git@github.com:lcorneliussen/wtc-site.git
    default_ref: origin/main
    port_offset: 1
    role: The official wtc site — the product this workspace exists to build; what it says about wtc comes from wtc-cli.

  # The wtc CLI and its OpenClaw plugin: the product the site describes. Its
  # docs/ are the source of truth for commands and behaviour.
  - name: wtc-cli
    remote: git@github.com:lcorneliussen/wtc-cli.git
    default_ref: origin/main
    role: The wtc CLI and OpenClaw plugin — what the site describes; its docs/ are the source of truth.

  # Public boilerplate for a team OpenClaw server. Downstream derived works
  # copy it and port upstream changes by hand.
  - name: clawfather-boilerplate
    remote: git@github.com:lcorneliussen/clawfather-boilerplate.git
    default_ref: origin/main
    role: Public boilerplate for a team OpenClaw server — per-provider hosting, extension points, upgrade and backport flows.

  # Public derived work of clawfather-boilerplate, run locally with Docker
  # Compose. The test bed for the boilerplate and for wtc integration. Serves
  # the gateway locally: WTC_CLAW_PORT = base + 2.
  - name: wtc-claw
    remote: git@github.com:lcorneliussen/wtc-claw.git
    default_ref: origin/main
    port_offset: 2
    role: Docker Compose claw derived from clawfather-boilerplate, public — the OpenClaw gateway for working on wtc, run locally (bin/claw deploy); test bed and wtc integration.

  # OpenClaw integration for Bitbucket Cloud pull requests, reviews and pipelines.
  - name: openclaw-bitbucket
    remote: git@github.com:lcorneliussen/openclaw-bitbucket.git
    default_ref: origin/main
    role: OpenClaw plugin and skill for Bitbucket Cloud personal logins, pull requests, reviews and pipelines.
